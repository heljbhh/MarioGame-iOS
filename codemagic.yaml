workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "MarioGame.xcodeproj"
        XCODE_SCHEME: "MarioGame"
    scripts:
      - name: Archive without code signing
        script: |
          set -e
          xcodebuild archive \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/MarioGame.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            -destination "generic/platform=iOS"
      - name: Package unsigned IPA
        script: |
          set -e
          APP_PATH="$CM_BUILD_DIR/build/MarioGame.xcarchive/Products/Applications/MarioGame.app"
          test -d "$APP_PATH"
          rm -rf "$CM_BUILD_DIR/build/Payload"
          mkdir -p "$CM_BUILD_DIR/build/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/build/Payload/"
          cd "$CM_BUILD_DIR/build"
          zip -r -y MarioGame-unsigned.ipa Payload
          rm -rf Payload
    artifacts:
      - build/MarioGame-unsigned.ipa
